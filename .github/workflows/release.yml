name: Release

# version-bump.yml tags every merge to main as vX.Y.Z and pushes the tag - this workflow reacts
# to that tag push, builds both deployable jars at that exact commit, and publishes them as a
# GitHub Release. Never triggered by a pull_request/fork, so no untrusted code ever runs with
# repo secrets here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # --refresh-dependencies: the paper module resolves orelia-core as a jitpack
        # "main-SNAPSHOT" (changing module) - see build.yml for why a stale Gradle cache hit is
        # a real risk here.
        run: ./gradlew build --no-daemon --refresh-dependencies

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            paper/build/libs/orelia-serverutil-*.jar \
            velocity/build/libs/orelia-serverutil-velocity-*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
